# =============================================================================
# Standalone SNN — NRP Configuration (Control Experiment)
# =============================================================================
# Trains the SAME StudentSNN architecture directly on ground truth spike
# counts via Poisson NLL. No teacher, no distillation, no KL divergence.
#
# Loss: L = PoissonNLL(student, y_true)
#
# Purpose: Control experiment for Review Item 3 — proves that teacher
# distillation provides value beyond raw data supervision.
# =============================================================================

# --- Student model architecture (identical to distilled version) ---
model:
  type: "student_snn"
  architecture: "student_snn"
  hidden_size: 256          # Same as teacher for fair comparison
  beta: 0.9                 # Membrane potential decay rate
  threshold: 1.0            # Spike threshold
  gradient_slope: 25.0      # Surrogate gradient slope
  learn_beta: true           # Per-neuron learnable decay constants
  num_layers: 2              # Stacked spiking layers
  neuron_type: "rsynaptic"   # Two-compartment (synaptic + membrane)
  alpha: 0.85                # Synaptic current decay (RSynaptic only)

# --- Training hyperparameters ---
training:
  epochs: 50
  learning_rate: 0.001
  batch_size: 512
  scheduler: "cosine"
  warmup_epochs: 3
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  patience: 15               # Early stopping patience
  val_every_n_epochs: 1

# --- Loss config ---
loss:
  type: "poisson_nll"
  log_input: false            # PoissonNLL expects rates, not log-rates
