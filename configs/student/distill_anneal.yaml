# Student SNN Distillation — β annealing experiment
# Cosine annealing: β=0.5 → β=0.0 over training
# Idea: lean on teacher early (student is random), refine on ground truth later

model:
  type: "student_snn"
  hidden_size: 256
  beta: 0.9
  threshold: 1.0
  gradient_slope: 25.0
  learn_beta: true
  num_layers: 3
  neuron_type: "rsynaptic"
  alpha: 0.85
  dropout: 0.2

distillation:
  distill_weight: 0.5            # Start β
  distill_weight_min: 0.0        # End β (pure ground truth by end)
  distill_schedule: "cosine"     # Smooth cosine decay
  reg_weight: 0.001
  reg_type: "l1"

training:
  epochs: 50
  learning_rate: 0.001
  batch_size: 512
  scheduler: "cosine"
  warmup_epochs: 3
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  patience: 15
  val_every_n_epochs: 1

loss:
  log_input: false
