# =============================================================================
# Multi-Head SNN Distillation from Mamba — KOSMOS Configuration
# =============================================================================
# Extends standard Mamba→SNN distillation with auxiliary heads that decode
# behavioral variables (stimulus contrast, response choice) from the shared
# spiking backbone. The auxiliary losses are trial-masked.
#
# Loss: L = L_dynamics + λ_stim * L_stimulus + λ_resp * L_response
#
# L_dynamics = PoissonNLL(student, y_true) + β * PoissonKL(mamba, student)
#              + α * L1_spike_reg
# L_stimulus = MSE(student_contrast, true_contrast) [trial-masked]
# L_response = CE(student_response, true_choice) [trial-masked]
# =============================================================================

# --- Student model architecture ---
model:
  type: "student_snn"
  hidden_size: 256            # Same as Mamba teacher for fair capacity
  beta: 0.9                   # Membrane potential decay rate
  threshold: 1.0              # Spike threshold
  gradient_slope: 25.0        # Surrogate gradient slope
  learn_beta: true            # Per-neuron learnable decay constants
  num_layers: 2               # Stacked spiking layers
  neuron_type: "rsynaptic"    # Two-compartment (synaptic + membrane)
  alpha: 0.85                 # Synaptic current decay (RSynaptic only)

  # Multi-head: auxiliary behavioral heads on shared backbone
  auxiliary_heads:
    - "stimulus"              # Left/right visual contrast (regression)
    - "response"              # Response choice classification (3 classes)

# --- Distillation loss weights ---
distillation:
  distill_weight: 0.5         # β: Poisson KL(teacher, student) weight
  reg_weight: 0.001           # α: L1 spike sparsity regularization
  reg_type: "l1"              # Regularization type

  # Multi-head auxiliary loss weights
  stimulus_weight: 0.1        # λ_stim: contrast regression weight
  response_weight: 0.1        # λ_resp: response classification weight

# --- Training hyperparameters ---
training:
  epochs: 50
  learning_rate: 0.001
  batch_size: 512
  scheduler: "cosine"
  warmup_epochs: 3
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  patience: 15                # Early stopping patience
  val_every_n_epochs: 1

# --- Loss config ---
loss:
  log_input: false            # PoissonNLL expects rates, not log-rates
