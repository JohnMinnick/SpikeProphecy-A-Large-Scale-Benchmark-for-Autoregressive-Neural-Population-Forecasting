# =============================================================================
# configs/data/ibl_repeated_site_20_sessions_nrp.yaml
# IBL Brain-wide Map — 20 sessions for NRP deployment.
#
# Scales from 3-session local validation to 20 sessions on NRP.
# Same hyperparameters as the 3-session config for fair comparison.
# =============================================================================

# --- Data source ---
source:
  type: "ibl"

# --- IBL-specific settings ---
ibl:
  tag: "repeated_site"        # IBL data release tag
  max_sessions: 20            # Scale up from 3 → 20 for NRP
  cache_dir: "data/raw/ibl"   # Local cache for ONE API downloads

# --- Binning and windowing (matched to Steinmetz) ---
bin_width_ms: 50          # 50 ms bins (same as Steinmetz)
history_bins: 10          # T = 10 bins -> 500 ms history window
forecast_horizon: 1       # H = 1 (one-step forecasting)

# --- Reproducibility ---
seed: 42

# --- Unit filtering ---
nwb:
  sampling_frequency: 30000.0
  min_firing_rate_hz: 1.0
  max_units: null
  quality_labels: null        # IBL uses numeric metrics, not "good"/"mua" labels
  brain_region: null
  duration_limit_s: null

# --- History features (disabled for baseline) ---
history_features:
  enabled: false

# --- Covariates DISABLED (pure spike history) ---
covariates:
  enabled: false

# --- Train/val/test splits (matched to Steinmetz) ---
splits:
  train: 0.7
  val: 0.15
  test: 0.15

# --- Batch size ---
batch_size: 512

# --- Compute ---
compute:
  device: "auto"
  num_workers: 6
  pin_memory: true
  distributed: false

# --- Session loading mode ---
loader_mode: "lazy"
